<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자연 단어 발음 비교</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#151a1a;color:#eee}h1{font-size:20px;margin-top:28px}p{color:#bbb;font-size:14px}button{display:block;width:100%;margin:8px 0;background:#2a3233;color:#eee;border:1px solid #555;border-radius:12px;padding:12px;font-size:16px;text-align:left}button.on{background:#b07d12}</style></head><body><p>단어마다 맞게 들리는 번호를 알려 주세요. (예: 자연 2, 경치 1 …)</p><h1><span style="font-size:30px">ທຳມະຊາດ</span> 탐마싿 (자연)</h1><button data-s="../../audio/1pdm10a.mp3?v=9">0. 지금 앱 음성</button><button data-s="1pdm10a/male.mp3">1. 남자 목소리</button><button data-s="1pdm10a/sp.mp3">2. 여자 목소리, "ທຳ ມະ ຊາດ" 띄어 읽기</button><button data-s="1pdm10a/spm.mp3">3. 남자 목소리, 띄어 읽기</button><button data-s="1pdm10a/first.mp3">4. 여자 목소리, 두 번 읽은 것 중 앞부분</button><h1><span style="font-size:30px">ວິວ</span> 위우 (경치)</h1><button data-s="../../audio/1v50zur.mp3?v=9">0. 지금 앱 음성</button><button data-s="1v50zur/male.mp3">1. 남자 목소리</button><button data-s="1v50zur/first.mp3">2. 여자 목소리, 두 번 읽은 것 중 앞부분</button><h1><span style="font-size:30px">ຫ້ວຍ</span> 후아이 (개울)</h1><button data-s="../../audio/xaoh6d.mp3?v=9">0. 지금 앱 음성</button><button data-s="xaoh6d/male.mp3">1. 남자 목소리</button><button data-s="xaoh6d/first.mp3">2. 여자 목소리, 두 번 읽은 것 중 앞부분</button><h1><span style="font-size:30px">ສວນ</span> 쑤안 (밭)</h1><button data-s="../../audio/zoscid.mp3?v=9">0. 지금 앱 음성</button><button data-s="zoscid/male.mp3">1. 남자 목소리</button><button data-s="zoscid/first.mp3">2. 여자 목소리, 두 번 읽은 것 중 앞부분</button><button data-s="zoscid/last.mp3">3. 여자 목소리, "ມີ ສວນ" 뒷부분</button><h1><span style="font-size:30px">ໄຮ່</span> 하이 (산밭)</h1><button data-s="../../audio/5crzdp.mp3?v=9">0. 지금 앱 음성</button><button data-s="5crzdp/male.mp3">1. 남자 목소리</button><button data-s="5crzdp/first.mp3">2. 여자 목소리, 두 번 읽은 것 중 앞부분</button><script>const a=new Audio();document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');a.src=b.dataset.s;a.play()});a.onended=()=>document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'))</script></body></html>
