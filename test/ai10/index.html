<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>증손 발음 비교</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#151a1a;color:#eee}h1{font-size:20px}p{color:#bbb;font-size:14px}button{display:block;width:100%;margin:8px 0;background:#2a3233;color:#eee;border:1px solid #555;border-radius:12px;padding:12px;font-size:16px;text-align:left}button.on{background:#b07d12}</style></head><body>
<h1><span style="font-size:30px">ເຫຼັນ</span> 렌 (증손)</h1><p>"렌"으로 들리는 번호를 알려 주세요.</p><button data-s="../../audio/1q5xxm6.mp3">0. 지금 앱 음성</button><button data-s="a/male.mp3">1. 남자 목소리</button><button data-s="a/first.mp3">2. 여자 목소리, 두 번 읽은 것 중 앞부분</button><button data-s="a/mfirst.mp3">3. 남자 목소리, 두 번 읽은 것 중 앞부분</button><button data-s="a/last.mp3">4. 여자 목소리, "ມີ ເຫຼັນ" 뒷부분</button><button data-s="a/lan.mp3">5. 여자 목소리, "ຫຼານ ເຫຼັນ" 뒷부분</button><button data-s="b/cur.mp3">6. 여자 목소리, 옛 철자 ເຫລັນ</button><button data-s="b/male.mp3">7. 남자 목소리, 옛 철자 ເຫລັນ</button><button data-s="b/first.mp3">8. 여자 목소리, 옛 철자 두 번 읽은 것 중 앞부분</button><script>const a=new Audio();document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');a.src=b.dataset.s;a.play()});a.onended=()=>document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'))</script></body></html>
