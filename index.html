/* v3.04 RYU: 도움말 탭 */:root{--ph:#5E6E1F;--ph-soft:#EEF1DD}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ph:#BFD07A;--ph-soft:#2A2F17}}:root[data-theme="dark"]{--ph:#BFD07A;--ph-soft:#2A2F17}[data-g="PH"]{--accent:var(--ph);--accent-soft:var(--ph-soft)}.info .kbnote{display:none;color:var(--muted)}@media (hover:none) and (pointer:coarse){html:not(.tab) .info .kbnote{display:block}html:not(.tab) .info .kbnote~*{display:none}}.info table.facts kbd.kc{display:inline-block}
/* v3.09 RYU: phone too: 연속/묶음 재생 and 한국어 말하기 centred */.controls .bact{justify-content:center}html:not(.tab) .kbinfo{justify-content:center}@media (hover:none),(pointer:coarse){/* v3.12 RYU: phone: 한국어 말하기 + 연속/묶음 재생 on one centred row */html:not(.tab) .controls::before{content:"";flex:0 0 100%;order:7;height:0}html:not(.tab) .controls .kbinfo{order:8;flex:0 0 auto;margin:0 4px 0 auto;padding:0;align-self:center}html:not(.tab) .controls .bact{order:9;flex:0 0 auto;margin:0 auto 0 0}}
/* v2.44 RYU: bundle list = same width as its box, just under it (like the Korean app) */
.ddl.ddj{border:1px solid var(--line)!important;border-radius:16px!important;padding:6px!important;box-sizing:border-box;box-shadow:0 8px 20px rgba(0,0,0,.28)!important}
.ddl.ddj button{white-space:normal;display:block!important;text-align:center;border-radius:12px!important}
.ddl.ddj button[aria-selected=true]{background:var(--inv)!important;color:var(--ink)!important;font-weight:700}

/* v2.45 RYU: right-side 반복 buttons square on the right; 연속 재생 round left only, 묶음 재생 round right only */
.speak.all{border-radius:999px 0 0 999px!important}
.speak.all[data-playbundle][data-chain]{border-radius:999px 0 0 999px!important}
.speak.all[data-playbundle]:not([data-chain]){border-radius:0 999px 999px 0!important}
/* v2.47 RYU: menu = 시안 1: 대분류 underline tabs, 소분류 round chips with a border in the group colour (selected = --inv fill) */
.groups{gap:18px!important;padding:0 4px!important;border-bottom:1px solid var(--line);scrollbar-width:none;margin-bottom:-4px}
.groups::-webkit-scrollbar{display:none}
.group{gap:0!important;border:none!important;border-radius:0!important;background:none!important;color:var(--muted)!important;padding:8px 0 9px!important;font-size:15px;position:relative;box-shadow:none!important}
.group i,.group small{display:none!important}
.group[aria-pressed="true"]{color:var(--ink)!important;background:none!important;border:none!important}
.group[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.subs{gap:8px!important;padding:2px 0 4px!important;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex-direction:row!important;align-items:center!important;gap:5px!important;border:1.5px solid var(--accent)!important;border-radius:8px 999px 999px 8px!important;background:var(--sheet)!important;padding:3px 12px 4px!important;min-width:0!important;color:var(--ink)!important}
.sub .code{font-size:12px!important;color:var(--accent)!important;letter-spacing:0!important;font-weight:700}
.sub .name{font-size:14px}
.sub[aria-selected="true"]{border:1.5px solid var(--accent)!important;border-left:5px solid var(--accent)!important;padding-left:10px!important;background:var(--inv)!important}
.sinfo{font-size:12px;color:var(--muted);padding:0 4px;margin-top:-12px}
.sinfo b{font-weight:600}
html.pre .sinfo{display:none!important}
html.tab .group{font-size:20px}html.tab .sub .name{font-size:19px}html.tab .sub .code{font-size:16px!important}html.tab .sinfo{font-size:15px}

/* Layout: same key-tag system as Practical Hotel English. Each PART owns a color; 소분류 are key tags; one calm sheet below. */
:root{
  --bg:#F3F4F2; --sheet:#FFFFFF; --ink:#1A201F; --muted:#5E6866; --line:#DDE2E0; --raise:#F7F8F7;
  --p1:#1F5F8F; --p1-soft:#E3EEF7;
  --p2:#3B7650; --p2-soft:#E4F1E8;
  --p3:#A23B57; --p3-soft:#F8E6EB;
  --p4:#6A4C9C; --p4-soft:#EEE8F6;
  --p5:#966511; --p5-soft:#F6EEDC; --p6:#1E6E73; --p6-soft:#DFF0F0; --p7:#A0481E; --p7-soft:#F7E6DC; --p8:#1F4E8C; --p8-soft:#E2EAF5; --p9:#6A4C9C; --p9-soft:#EDE6F7;
  --accent:var(--p1); --accent-soft:var(--p1-soft);
  --good:#1E7F4F; --bad:#B33A3A;
  --display:"Space Grotesk","Lao Local","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"Lao Local","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --lao:"Lao Local","Noto Sans Lao Looped","Phetsarath OT","Saysettha OT","Lao UI",sans-serif;
}

  --p1:#78B4E6; --p1-soft:#1C2E3E; --p2:#7CC795; --p2-soft:#1C3024; --p3:#EE8AA5; --p3-soft:#3A1E27;
  --p4:#B79CEB; --p4-soft:#2A2238; --p5:#E2B25A; --p5-soft:#352A15; --p6:#6FC9C9; --p6-soft:#16302F; --p7:#F0A070; --p7-soft:#3A2316; --p8:#8DB4E8; --p8-soft:#172538; --p9:#B9A0E6; --p9-soft:#261E36; --good:#5FCB8E; --bad:#F08080; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --sheet:#191E1D; --ink:#E8EDEB; --muted:#9BA7A4; --line:#2C3533; --raise:#202725;
  --p1:#78B4E6; --p1-soft:#1C2E3E; --p2:#7CC795; --p2-soft:#1C3024; --p3:#EE8AA5; --p3-soft:#3A1E27;
  --p4:#B79CEB; --p4-soft:#2A2238; --p5:#E2B25A; --p5-soft:#352A15; --p6:#6FC9C9; --p6-soft:#16302F; --p7:#F0A070; --p7-soft:#3A2316; --p8:#8DB4E8; --p8-soft:#172538; --p9:#B9A0E6; --p9-soft:#261E36; --good:#5FCB8E; --bad:#F08080; color-scheme:dark}

[data-g="P3"]{--accent:var(--p3);--accent-soft:var(--p3-soft)}
[data-g="P4"]{--accent:var(--p4);--accent-soft:var(--p4-soft)}
[data-g="P5"]{--accent:var(--p5);--accent-soft:var(--p5-soft)}
[data-g="P6"]{--accent:var(--p6);--accent-soft:var(--p6-soft)}

.lishd{margin:4px 0 6px}
/* v2.63 라오스 탭 info pages */
.info{padding:6px 4px 12px;font-size:15.5px;line-height:1.65;color:var(--ink)}
.info h2{font-size:21px;margin:4px 0 0;line-height:1.3}
.info .sub2{color:var(--muted);font-size:14px;margin-bottom:14px}
.info figure{margin:0 0 14px;text-align:center}
.info figure svg.flag,.info figure img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.info figure img{background:var(--line)}
.info figure.sm img{max-width:190px;box-shadow:none;background:none}
.info figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.info figcaption small{display:block;font-size:11px;opacity:.85}
.info .facts{width:100%;border-collapse:collapse;margin:2px 0 14px;font-size:14.5px}
.info .facts th{width:31%;text-align:left;font-weight:700;color:var(--accent);padding:7px 6px;vertical-align:top;border-bottom:1px solid var(--line)}
.info .facts td{padding:7px 6px;border-bottom:1px solid var(--line)}
.info h3{font-size:16.5px;margin:18px 0 6px;padding-left:9px;border-left:4px solid var(--accent);line-height:1.35}
.info p{margin:0 0 8px}
.info .lo{font-family:var(--lao)}
.info .r{color:var(--accent)}
.info .clr{display:flex;flex-direction:column;gap:7px;margin:6px 0 10px}
.info .clr div{display:flex;gap:10px;align-items:flex-start}
.info .clr i{flex:none;width:22px;height:22px;border-radius:5px;margin-top:2px;border:1px solid var(--line)}
.info .terms{background:var(--accent-soft);border-radius:12px;padding:8px 14px;margin:8px 0 14px}
.info .terms div{padding:5px 0;border-bottom:1px dashed var(--line)}.info .terms div:last-child{border:0}
.info .terms .lo{font-size:17px;font-weight:700}.info .terms .r{margin:0 8px 0 6px}
.info .rel{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.info .rel button{border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:3px 13px;font:inherit;font-size:13.5px;cursor:pointer}
@media (min-width:860px){.info{padding:8px 14px 14px}.info .top2{display:grid;grid-template-columns:44% 1fr;gap:28px;align-items:start}.info .two{display:grid;grid-template-columns:1fr 1fr;gap:32px}.info .facts th{width:28%}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.lo{font-family:var(--lao)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px;display:flex;flex-direction:column;gap:16px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
/* title banner: Laos (That Luang, Mekong, palms, dok champa); day art in light theme, dusk art in dark theme, edges fade into the page */
:root{--hd-img:url(header-day.svg);--hd-ov:linear-gradient(90deg,rgba(243,244,242,.94) 0%,rgba(243,244,242,.7) 40%,rgba(243,244,242,0) 78%);--hd-fg:var(--ink);--hd-mut:var(--muted);--hd-lo:var(--accent);--hd-sh:0 1px 6px rgba(255,255,255,.6);--hd-pill:rgba(255,255,255,.32)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hd-img:url(header.svg);--hd-ov:linear-gradient(90deg,rgba(17,21,20,.92) 0%,rgba(17,21,20,.6) 40%,rgba(17,21,20,0) 78%);--hd-fg:#fff;--hd-mut:rgba(255,255,255,.8);--hd-lo:#F6CB5A;--hd-sh:0 1px 8px rgba(0,0,0,.45);--hd-pill:rgba(17,21,20,.32);--hd-two:#1b1b1b}}
:root[data-theme="dark"]{--hd-img:url(header.svg);--hd-ov:linear-gradient(90deg,rgba(17,21,20,.92) 0%,rgba(17,21,20,.6) 40%,rgba(17,21,20,0) 78%);--hd-fg:#fff;--hd-mut:rgba(255,255,255,.8);--hd-lo:#F6CB5A;--hd-sh:0 1px 8px rgba(0,0,0,.45);--hd-pill:rgba(17,21,20,.32);--hd-two:#1b1b1b}
header{position:relative;isolation:isolate;padding:22px 20px 18px;min-height:120px;color:var(--hd-fg)}
header::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:16px;background:var(--hd-ov),var(--hd-img) 70% 50%/cover no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%),linear-gradient(to right,#000 85%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 62%,transparent 100%),linear-gradient(to right,#000 85%,transparent 100%);mask-composite:intersect}
header .eyebrow{color:var(--hd-mut);padding-left:.45em}
header .stats{margin-left:auto;gap:14px;align-items:baseline;white-space:nowrap}
header .stats span{display:inline-flex;align-items:baseline;gap:4px}
header .stats b{display:inline}
header .stats{font-size:11px;gap:10px;padding:5px 11px;border-radius:10px}
header .stats b{font-size:13px}
html.tab header .stats{font-size:14px;gap:12px;padding:6px 13px}
html.tab header .stats b{font-size:17px}
header h1{color:var(--hd-fg);text-shadow:var(--hd-sh)}
header h1 .lo{color:var(--hd-lo)}
header .stats{color:var(--hd-mut)}
header .stats b{color:var(--hd-fg)}
h1.lotitle{font-size:clamp(28px,calc((100vw - 96px)/8.1),66px);line-height:1.1;margin-top:-.12em;white-space:nowrap}@media (max-width:600px){header{padding-left:16px;padding-right:16px}}
h1.lotitle .lo{font-weight:700;letter-spacing:.01em}
html.tab h1.lotitle{font-size:clamp(63px,8vw,82px)}
