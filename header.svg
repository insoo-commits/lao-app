<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b55"/>
      <stop offset=".45" stop-color="#7b4a78"/>
      <stop offset=".75" stop-color="#e2895a"/>
      <stop offset="1" stop-color="#f6c76b"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9a868"/>
      <stop offset="1" stop-color="#5a3f5e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8821f"/>
      <stop offset=".5" stop-color="#f3cd58"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".6" stop-color="#ffd977" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd977" stop-opacity="0"/>
    </radialGradient>
    <g id="spire">
      <path d="M0 -70 C3 -50 6 -30 7 0 L-7 0 C-6 -30 -3 -50 0 -70Z"/>
      <rect x="-10" y="0" width="20" height="10" rx="2"/>
    </g>
    <g id="palm">
      <path d="M0 0 C2 -30 4 -60 0 -90" stroke="#2a1f33" stroke-width="5" fill="none"/>
      <g fill="#2a1f33">
        <path d="M0 -90 C-20 -100 -40 -95 -55 -80 C-35 -88 -18 -88 0 -86Z"/>
        <path d="M0 -90 C20 -102 42 -98 58 -82 C38 -90 18 -90 0 -86Z"/>
        <path d="M0 -90 C-12 -110 -30 -118 -48 -116 C-28 -108 -14 -100 0 -88Z"/>
        <path d="M0 -90 C12 -112 32 -120 50 -116 C30 -108 14 -100 0 -88Z"/>
        <path d="M0 -92 C-2 -110 2 -124 8 -132 C4 -116 3 -104 0 -90Z"/>
      </g>
    </g>
    <g id="champa">
      <g fill="#fffaf0">
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(0)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(72)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(144)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(216)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#f6c443"/>
    </g>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle cx="860" cy="196" r="70" fill="url(#sun)"/>
  <circle cx="860" cy="196" r="30" fill="#ffe7a3" opacity=".9"/>

  <!-- distant mountains -->
  <path d="M0 210 L80 170 L150 195 L240 150 L330 190 L420 160 L520 200 L600 175 L700 205 L1200 205 L1200 300 L0 300Z" fill="#8b5a7a" opacity=".55"/>
  <path d="M500 215 L620 168 L720 200 L830 160 L940 198 L1040 165 L1130 192 L1200 175 L1200 300 L500 300Z" fill="#6c4567" opacity=".7"/>

  <!-- Mekong -->
  <rect y="228" width="1200" height="72" fill="url(#river)"/>
  <g stroke="#ffe1a0" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M820 240 H900"/><path d="M835 250 H885"/><path d="M845 260 H875"/>
    <path d="M300 255 H340"/><path d="M560 268 H610"/><path d="M1000 262 H1050"/>
  </g>

  <!-- That Luang style stupa on the bank -->
  <g transform="translate(700 228)" fill="url(#gold)">
    <rect x="-150" y="-14" width="300" height="14" fill="#7a4e2a"/>
    <rect x="-130" y="-28" width="260" height="14" rx="2"/>
    <rect x="-110" y="-42" width="220" height="14" rx="2"/>
    <g transform="translate(0 -42)">
      <use href="#spire" transform="translate(-95 -10) scale(.55)"/>
      <use href="#spire" transform="translate(-70 -10) scale(.6)"/>
      <use href="#spire" transform="translate(-45 -10) scale(.65)"/>
      <use href="#spire" transform="translate(45 -10) scale(.65)"/>
      <use href="#spire" transform="translate(70 -10) scale(.6)"/>
      <use href="#spire" transform="translate(95 -10) scale(.55)"/>
      <path d="M-40 0 C-38 -18 -26 -30 -18 -36 L18 -36 C26 -30 38 -18 40 0Z"/>
      <path d="M-18 -36 C-14 -60 -6 -95 0 -150 C6 -95 14 -60 18 -36Z"/>
      <rect x="-22" y="-40" width="44" height="6" rx="2" fill="#f6dc85"/>
      <circle cx="0" cy="-153" r="3.5" fill="#fff0b0"/>
    </g>
  </g>
  <!-- reflection -->
  <g transform="translate(700 230) scale(1 -.35)" opacity=".25" fill="#ffd36b">
    <rect x="-110" y="-42" width="220" height="42"/>
    <path d="M-18 -78 C-14 -100 -6 -130 0 -190 C6 -130 14 -100 18 -78Z"/>
  </g>

  <!-- palms -->
  <use href="#palm" transform="translate(470 232) scale(.9)"/>
  <use href="#palm" transform="translate(505 234) scale(.7)"/>
  <use href="#palm" transform="translate(955 232) scale(1)"/>
  <use href="#palm" transform="translate(1000 236) scale(.75)"/>
  <use href="#palm" transform="translate(1150 236) scale(1.1)"/>

  <!-- long-tail boat -->
  <g transform="translate(1040 268)" fill="#2a1f33">
    <path d="M-60 0 C-40 8 30 8 60 -4 L56 2 C30 12 -40 12 -62 4Z"/>
    <path d="M-20 -4 L-18 -24 L-14 -4Z"/>
    <circle cx="-16" cy="-28" r="4"/>
  </g>

  <!-- dok champa, national flower -->
  <use href="#champa" transform="translate(1150 52) scale(1.3)"/>
  <use href="#champa" transform="translate(1100 30) scale(.9)"/>
  <use href="#champa" transform="translate(1180 110) scale(.8)"/>
</svg>
