<meta charset="utf-8">
<title>PhasaLAO 인트로 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+Lao+Looped:wght@500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap">
<style>
/* Viewer (device tabs + stage) showing one of three fixed-size mock screens, scaled to fit.
   Colours follow the PhasaLAO app: amber-brown title gradient (#C0801F / #8A4A16) with the orange sun glow of the header,
   and the baby elephant's scarf (red with gold diamonds, like a sinh hem). Text is Korean with Lao beside it; no language picker. */
:root{
  --bg:#F3EEE6;--panel:#FFFFFF;--ink:#2A1D12;--muted:#7A6A5A;--line:#E6DACA;--accent:#8A4A16;--accent2:#C0801F;
  --display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif;
  --ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --txt:"IBM Plex Sans KR","Noto Sans Lao",system-ui,sans-serif;
  --lao:"Noto Sans Lao Looped","Noto Sans Lao",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110B;--panel:#221A12;--ink:#F1E8DC;--muted:#B5A28C;--line:#3A2C1E;--accent:#F0B868;--accent2:#D9973A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110B;--panel:#221A12;--ink:#F1E8DC;--muted:#B5A28C;--line:#3A2C1E;--accent:#F0B868;--accent2:#D9973A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--ko);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* ---------- viewer ---------- */
.vw{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:1440px;margin:0 auto}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.vtitle{display:flex;align-items:center;gap:10px;min-width:0}
.vtitle img{width:38px;height:38px;border-radius:10px}
.vtitle h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.2;letter-spacing:-.01em}
.vtitle p{margin:0;color:var(--muted);font-size:13px}
.vopts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button small{font-weight:500;font-family:var(--display);opacity:.7}
.tabs button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#17110B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#17110B}}
.zbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.vnote{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.vnote b{color:var(--ink)}
.stage{margin-top:18px;display:flex;justify-content:center;overflow-x:auto}
.scaler{transform-origin:top left;flex:none}
.stage.fit{overflow:hidden}

/* device frames */
.frame{position:relative;background:#0E1621;flex:none}
.frame.phone{width:414px;padding:12px;border-radius:56px;box-shadow:0 30px 60px rgba(60,30,10,.25)}
.frame.phone .screen{width:390px;height:820px;border-radius:44px}
.frame.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#0E1621;z-index:5}
.frame.pad{width:860px;padding:20px;border-radius:38px;box-shadow:0 30px 60px rgba(10,30,70,.22)}
.frame.pad .screen{width:820px;height:1100px;border-radius:20px}
.frame.pc{width:1280px;border-radius:14px;padding:0;background:#E6DCCD;box-shadow:0 30px 70px rgba(10,30,70,.22);overflow:hidden}
.frame.pc .screen{width:1280px;height:820px;border-radius:0}
.chrome{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#EFE8DE;border-bottom:1px solid #DDD0C0}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#F26B5E;display:block}.dots i:nth-child(2){background:#F5BE4F}.dots i:nth-child(3){background:#5CC567}
.url{flex:1;max-width:560px;height:28px;border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;font:13px var(--display);color:#5A4634}
.url .inst{margin-left:auto;display:flex;align-items:center;color:#8A4A16}
.screen{overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}

/* ---------- mock (its own light/dark, chosen by the mock's Theme setting) ---------- */
.m{--mb:#F5F0E8;--ms:#FFFFFF;--mi:#2A1D12;--mm:#7A6A5A;--ml:#EADFCF;--blue:#8A4A16;--blue2:#C0801F;--sky:#E0A04A;--red:#C8341F;--gold:#F2C230;--tint:#F8EEDF;--deep:#3A1C08;--on:#FFFFFF;
  background:var(--mb);color:var(--mi);font-family:var(--txt);font-size:calc(16px * var(--fz,1));line-height:1.65;min-height:100%}
.m.dk{--mb:#17110B;--ms:#221A12;--mi:#F1E8DC;--mm:#B5A28C;--ml:#3A2C1E;--blue:#F0B868;--blue2:#D9973A;--tint:#2E2216;--deep:#1E0E04;--on:#17110B}
.m .lo{font-family:var(--lao)}
.m .ko{font-family:var(--ko)}
.m h2,.m h3{margin:0;line-height:1.3;text-wrap:balance}
.m button{cursor:pointer}
.m .kosub{font-family:var(--ko);font-size:.78em;color:var(--mm);font-weight:500}
/* the elephant's scarf: red with yellow diamonds */
.scarf{height:8px;background:
  linear-gradient(135deg,transparent 0 35%,var(--gold) 35% 65%,transparent 65%) 0 0/12px 8px,
  linear-gradient(45deg,transparent 0 35%,var(--gold) 35% 65%,transparent 65%) 0 0/12px 8px,var(--red)}

/* brand */
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:-.01em;line-height:1}
.brand span{display:block;font-size:11px;letter-spacing:.02em;opacity:.85;margin-top:3px}
.freepill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.5);background:rgba(58,28,8,.35);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.freepill i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden;isolation:isolate}
.hero>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(58,28,8,.25) 0%,rgba(58,28,8,0) 26%,rgba(138,74,22,.62) 58%,var(--deep) 100%)}
.hero .badge{display:inline-flex;align-self:flex-start;justify-self:start;align-items:center;gap:8px;background:#fff;color:#8A4A16;border-radius:99px;padding:3px 12px 3px 4px;font-family:var(--display);font-weight:700;font-size:.82em;letter-spacing:.01em}
.hero .badge img{width:22px;height:22px;border-radius:50%}
.hero h1{font-family:var(--lao);font-weight:700;letter-spacing:0;line-height:1.15;margin:0}
.hero .losub{font-weight:600;line-height:1.45;margin:0;opacity:.96}
.hero .lead{opacity:.9;margin:0}

/* stats */
.stats{display:flex;gap:0;font-variant-numeric:tabular-nums}
.stats div{flex:1;padding:0 12px;border-left:1px solid rgba(255,255,255,.25)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font-family:var(--display);font-size:1.45em;line-height:1.1;font-weight:700}
.stats span{font-size:.76em;opacity:.88}

/* PASS: settings styled as a study card, with the scarf band */
.pass{color:var(--mi);background:var(--ms);border-radius:22px;box-shadow:0 1px 2px rgba(70,40,15,.06),0 18px 40px rgba(70,40,15,.16);overflow:hidden;position:relative;border:1px solid var(--ml)}
.passhead{background:radial-gradient(120% 160% at 0% 0%,#D9973A 0%,#A65A1C 50%,#4A2008 100%);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.passhead::after{content:"";position:absolute;right:-40px;top:-60px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#FFC46A 0%,transparent 68%);opacity:.6}
.passhead .ph{width:50px;height:56px;border-radius:12px;background:rgba(255,255,255,.95);display:grid;place-items:end center;overflow:hidden;flex:none}
.passhead .ph img{width:48px;height:auto;display:block;margin-bottom:-4px}
.passhead .pt{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:.74em;opacity:.85}
.passhead .pn{font-weight:600;font-size:1em;line-height:1.35}
.passhead .pn small{display:block;font-family:var(--ko);font-weight:500;font-size:.74em;opacity:.8}
.passhead .pid{margin-left:auto;font-family:var(--display);font-size:.72em;letter-spacing:.08em;text-align:right;opacity:.85;line-height:1.4;position:relative;z-index:1}
.passbody{padding:6px 18px 16px;display:grid;gap:2px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:11px 0;border-bottom:1px dashed var(--ml)}
.row:last-of-type{border-bottom:0}
.row .lab{font-weight:600;font-size:.92em;line-height:1.35}
.row .lab small{display:block;font-family:var(--ko);color:var(--mm);font-weight:500;font-size:.78em}
.row.full{grid-template-columns:1fr}
.seg{display:inline-flex;background:var(--tint);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 10px;font-weight:600;font-size:.85em;color:var(--mm);font-family:var(--display);min-width:34px}
.seg button.on{background:var(--ms);color:var(--blue);box-shadow:0 1px 3px rgba(70,40,15,.18)}
.m.dk .seg button.on{background:var(--blue2);color:#0F1720}
.seg.txt button{font-family:inherit}
.rate{display:flex;align-items:center;gap:10px}
.rate input{flex:1;accent-color:var(--blue2);min-width:0}
.rate output{font-family:var(--display);font-weight:700;color:var(--blue);min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.ticks{display:flex;justify-content:space-between;font-family:var(--display);font-size:.68em;color:var(--mm);padding:0 2px;margin-top:-4px}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--ml);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--blue2)}
.sw.on::after{transform:translateX(20px)}
.sample{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:14px;padding:10px 12px;margin-top:8px}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--blue2);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px}
.sample .s1{font-family:var(--ko);font-weight:600;line-height:1.35}
.sample .s2{font-size:.85em;color:var(--mm);line-height:1.4}
.sample .s3{margin-left:auto;font-family:var(--display);font-size:.72em;color:var(--mm);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.passfoot{font-size:.8em;color:var(--mm);padding:10px 18px 12px;background:var(--mb);border-top:1px solid var(--ml);line-height:1.45}

/* CTA */
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:1em;display:inline-flex;align-items:center;justify-content:center;gap:10px;line-height:1.25}
.btn .ko{font-weight:600;opacity:.85;font-size:.85em}
.btn.pri{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(200,52,31,.35)}
.btn.sec{background:var(--tint);color:var(--blue)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn svg{width:18px;height:18px}

/* section headings */
.sh{display:flex;align-items:flex-start;gap:12px}
.sh .n{width:28px;height:28px;border-radius:50%;background:var(--blue2);color:#fff;font-family:var(--display);font-weight:700;display:grid;place-items:center;flex:none;font-size:.85em;margin-top:2px}
.sh h2{font-size:1.12em}
.sh p{margin:2px 0 0;font-size:.85em;color:var(--mm);line-height:1.5}

/* how you learn: listen, say, quiz with the elephant */
.how3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hw{background:var(--ms);border:1px solid var(--ml);border-radius:16px;padding:10px 8px 10px;text-align:center;display:grid;justify-items:center;gap:2px;position:relative}
.hw img{width:64px;height:auto;display:block}
.hw b{font-size:.9em;line-height:1.3}
.hw small{font-family:var(--ko);font-size:.74em;color:var(--mm);line-height:1.2}
.hw .k{position:absolute;top:8px;left:8px;font-family:var(--display);font-weight:700;font-size:.7em;color:var(--blue2);background:var(--tint);border-radius:6px;padding:0 6px;line-height:1.7}
.hw+.hw::before{content:"";position:absolute;left:-7px;top:46px;width:6px;height:6px;border-top:2px solid var(--mm);border-right:2px solid var(--mm);transform:rotate(45deg);opacity:.6}

/* menus */
.menus{display:grid;gap:8px}
.mgl{grid-column:1/-1;font-size:.8em;font-weight:600;color:var(--mm);display:flex;align-items:center;gap:8px;margin-top:4px}
.mgl::after{content:"";flex:1;height:1px;background:var(--ml)}
.mt{display:flex;align-items:center;gap:10px;background:var(--ms);border:1px solid var(--ml);border-radius:12px;padding:6px 10px 6px 6px;min-width:0}
.mt .g{width:38px;height:38px;border-radius:10px;background:var(--tint);color:var(--blue);font-family:var(--ko);font-weight:700;display:grid;place-items:center;flex:none;font-size:.78em;letter-spacing:-.04em}
.mt.live .g{background:#E4EEF8;color:#1F5C9A}
.m.dk .mt.live .g{background:#1A2A3A;color:#9AC8F0}
.mt .t{min-width:0;line-height:1.3}
.mt .t b{display:block;font-size:.88em;font-weight:600;line-height:1.3}
.mt .t small{font-family:var(--ko);color:var(--mm);font-size:.72em;line-height:1.2;display:block}

/* install */
.inst{border-radius:24px;overflow:hidden;position:relative;color:#fff;isolation:isolate;background:var(--deep)}
.inst>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.5}
.inst::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(30,14,4,.6),rgba(138,74,22,.93))}
.detect{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 12px 5px 6px;font-size:.82em;justify-self:start}
.detect i{width:22px;height:22px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#1A1400;font-style:normal}
.detect i svg{width:13px;height:13px}
.otabs{display:flex;gap:6px;flex-wrap:wrap}
.otabs button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:99px;padding:5px 12px;font-size:.8em;font-weight:600;font-family:var(--display)}
.otabs button.on{background:#fff;color:#8A4A16;border-color:#fff}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;line-height:1.55;font-size:.92em}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8em}
.kbd{display:inline-grid;place-items:center;vertical-align:-.3em;width:1.6em;height:1.6em;border-radius:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);margin:0 2px}
.kbd svg{width:.95em;height:.95em}
.dls{display:grid;gap:10px}
.dl{display:flex;align-items:center;gap:12px;background:var(--ms);color:var(--mi);border-radius:16px;padding:12px 14px;min-width:0}
.dl .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--blue);flex:none;overflow:hidden}
.dl .ic img{width:34px;height:34px;border-radius:9px}
.dl .ic img.pst{width:42px;height:42px;border-radius:0;object-fit:cover;object-position:top}
.dl .ic svg{width:20px;height:20px}
.dl .tx{min-width:0;flex:1;line-height:1.4}
.dl .tx b{display:block;font-size:.92em}
.dl .tx small{color:var(--mm);font-size:.78em;display:block}
.dl .go{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.82em;background:var(--blue2);color:#fff;flex:none;white-space:nowrap}
.dl .go.y{background:var(--red);color:#fff}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:inline-grid;place-items:center}
.qrbox canvas,.qrbox img{display:block;width:132px!important;height:132px!important}
.addr{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:6px 6px 6px 12px;font-family:var(--display);font-size:.9em}
.addr button{margin-left:auto;border:0;background:#fff;color:#8A4A16;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.78em;font-family:var(--txt)}
.foot{color:var(--mm);font-size:.78em;line-height:1.6}
.foot b{font-family:var(--display);color:var(--mi);font-size:1.15em}
.toast{background:var(--mi);color:var(--mb);padding:8px 14px;border-radius:10px;font-size:.85em;z-index:20}

/* ---------- phone ---------- */
.P .hero{padding:58px 20px 24px;min-height:470px;display:flex;flex-direction:column}
.P .hero>img.bg{object-position:center 30%}
.P .hero .top{display:flex;align-items:center;justify-content:space-between}
.P .hero .copy{margin-top:auto;display:grid;gap:9px}
.P .hero h1{font-size:2.5em}
.P .hero .losub{font-size:1.02em}
.P .hero .lead{font-size:.88em}
.P .hero .stats{margin-top:6px}
.P .sec{padding:22px 18px 0;display:grid;gap:14px}
.P .menus{grid-template-columns:1fr 1fr}
.P .sticky{position:sticky;bottom:0;padding:12px 16px 26px;background:linear-gradient(180deg,rgba(0,0,0,0),var(--mb) 30%);z-index:4;margin-top:8px}
.P .sticky .btn{width:100%}
.P .inst{margin:24px 12px 0;padding:22px 18px;display:grid;gap:14px}
.P .foot{padding:22px 20px 8px;display:flex;gap:12px;align-items:flex-end}
.P .foot img{width:64px;flex:none}

/* ---------- iPad ---------- */
.T .hero{padding:30px 36px 100px;min-height:580px;display:flex;flex-direction:column}
.T .hero::after{background:linear-gradient(180deg,rgba(58,28,8,.45) 0%,rgba(58,28,8,0) 26%,rgba(138,74,22,.62) 62%,var(--deep) 100%)}
.T .hero .top{display:flex;align-items:center;justify-content:space-between}
.T .hero .copy{margin-top:auto;display:grid;gap:12px;max-width:620px}
.T .hero h1{font-size:3.4em}
.T .hero .losub{font-size:1.2em}
.T .hero .stats{max-width:520px;margin-top:8px}
.T .wrap{padding:0 30px;display:grid;gap:26px}
.T .duo{display:grid;grid-template-columns:300px 1fr;gap:22px;margin-top:-62px;position:relative;z-index:2;align-items:start}
.T .lcard{background:var(--ms);border-radius:22px;padding:18px;border:1px solid var(--ml);box-shadow:0 18px 40px rgba(70,40,15,.14);display:grid;gap:14px}
.T .lcard .how3{grid-template-columns:1fr}
.T .lcard .hw{grid-template-columns:64px 1fr;text-align:left;justify-items:start;align-items:center;column-gap:12px;padding:8px 12px 8px 8px}
.T .lcard .hw img{grid-row:span 2;width:60px}
.T .lcard .hw .k{left:auto;right:10px;top:10px}
.T .lcard .hw+.hw::before{left:36px;top:-7px;transform:rotate(135deg)}
.T .menus{grid-template-columns:repeat(3,1fr)}
.T .ctarow{display:grid;grid-template-columns:1fr 3fr;gap:14px}
.T .ctarow .btn{padding:20px;font-size:1.2em;border-radius:18px;white-space:nowrap}
.T .inst{margin:6px 30px 0;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:26px}

 <div class="frow">${foot(false)}<img src="img/happy.webp" alt="" style="width:130px;height:auto"></div>`; }

function pc(){ return `
 <div class="hero"><img class="bg" src="img/r-nongkhiaw.jpg" alt="농키아우"><span class="glow1"></span><span class="glow2"></span>
  <div class="nav">${brand()}<a href="#" data-act="noop">기초회화</a><a href="#" data-act="noop">문자학습</a><a href="#" data-act="noop">라오스</a><a href="#" data-act="noop">도움말</a><span class="sp"></span>${free()}${cta()}</div>

 <div class="band">

  <div><h2 style="margin-bottom:12px">${esc(x.inside)} <span class="kosub lo">${LO.inside}</span></h2>${menus()}<div class="gal"><img src="img/r-patuxai.jpg" alt="빠뚜싸이 분수"><img src="img/alms.jpg" alt="탁발"><img src="img/sinh.jpg" alt="씬" style="object-position:center 25%"></div></div>
 </div>
 <div class="inst"><img class="bg" src="img/r-sunset.jpg" alt="">
  <div style="display:grid;gap:14px;align-content:start">${detectChip("pc")}<h2 style="font-size:1.5em">${esc(x.it)}</h2><p style="margin:0;opacity:.85;font-size:.92em">${esc(x.itn)}</p>${osTabs("pc")}${steps("pc")}</div>
  <div style="display:grid;gap:12px;align-content:start;justify-items:start"><h3 style="font-size:1em">${esc(x.qr)}</h3><div class="qrbox" id="qr"></div><p style="margin:0;opacity:.85;font-size:.85em">${esc(x.qrd)}</p>${addr()}</div>

 </div>

const SIZES = {phone:[414, 844], pad:[860, 1140], pc:[1280, 864]};
const NOTES = {
 phone:"<b>폰</b>: RYU님 탓루앙 사진 위에 PhasaLAO 배지와 큰 라오 글자 제목 ‘ຮຽນ ພາສາລາວ’, 소개와 숫자(735 묶음 · 4,506 단어 · 16,889 문장 · 10 메뉴). 그 아래 ① 씬 치맛단 무늬를 두른 ‘PhasaLAO PASS’ 설정 카드 → ② 공부 방법(예문보기 S → 단어공부 W → 확인퀴즈 E, 코끼리 3컷) → 메뉴 10개 → 설치 안내. ‘시작하기’ 단추는 아래에 늘 붙어 있어요.",
 pad:"<b>아이패드</b>: 루앙프라방 왕궁 사원과 야시장 사진 위 제목, 왼쪽 공부 방법 카드와 오른쪽 설정 카드를 나란히. 메뉴는 3칸, 설치 안내는 단계와 내려받기를 두 칸으로.",
 pc:"<b>PC</b>: 농키아우 강마을 사진 위에 앱 제목 상자와 같은 호박색·갈색 빛을 덮고, 왼쪽 소개와 라오스 사진 4장, 오른쪽 설정 카드 옆에 코끼리. 아래 공부 방법 + 메뉴와 사진, 설치 안내는 ‘휴대폰으로 열기’ QR 포함 3칸."};
function frameHTML(){ const d = st.dev, body = d === "phone" ? phone() : d === "pad" ? pad() : pc();
  const m = `<div class="m ${d === "phone" ? "P" : d === "pad" ? "T" : "D"}${isDark() ? " dk" : ""}" lang="ko" style="--fz:${st.fz}">${body}</div>`;
  if (d === "pc") return `<div class="frame pc"><div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url">🔒 ${URL_APP}<span class="inst" title="Install">${ICON.inst.replace("<svg", '<svg width="18" height="18"')}</span></span></div><div class="screen" id="scr">${m}</div></div>`;
  return `<div class="frame ${d}"><div class="screen" id="scr">${m}</div></div>`; }

const $ = id => document.getElementById(id);
let lastDev = null, playing = false;
function render(){
  const scr = $("scr"), y = scr && lastDev === st.dev ? scr.scrollTop : 0;
  $("scaler").innerHTML = frameHTML();
  const s2 = $("scr"); if (s2) s2.scrollTop = y;
  lastDev = st.dev;
  ["phone","pad","pc"].forEach(d => { const b = $("t-" + d); b.classList.toggle("on", d === st.dev); b.setAttribute("aria-selected", d === st.dev); });
  $("vnote").innerHTML = NOTES[st.dev] + " 언어 선택과 동영상은 없어요. 카드에서 고른 반복·배속·한국어 음성·화면·글자 크기는 앱 설정에 그대로 저장되고(세 기기 시안에도 똑같이 반영), ▶ 들어 보기는 앱에 있는 실제 음성을 그 설정대로 들려줘요. 설치 안내는 접속한 기기를 알아보고 맞는 방법을 먼저 보여 줘요(지금 이 기기: <b>" + REAL_NAME + "</b>). 시안이라 다른 단추는 모양만 있어요.";
  $("zoom").textContent = st.zoom ? "화면에 맞춤" : "실제 크기";
  const q = $("qr"); if (q && window.QRCode) { try { new QRCode(q, {text: "https://" + URL_APP + "/", width: 264, height: 264, colorDark: "#3A1C08", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M}); } catch (e) {} }
  fit(); keep();
}
function fit(){
  const stage = $("stage"), sc = $("scaler"), [w, h] = SIZES[st.dev];
  stage.classList.toggle("fit", !st.zoom);
  if (st.zoom){ sc.style.transform = "none"; sc.style.width = w + "px"; sc.style.height = "auto"; stage.style.height = "auto"; return; }
  const avail = stage.clientWidth || w, k = Math.min(1, avail / w);
  sc.style.transform = "scale(" + k + ")"; sc.style.width = w + "px"; stage.style.height = Math.ceil(h * k) + "px";
}
window.addEventListener("resize", fit);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (st.theme === "auto") render(); }); } catch (e) {}
new MutationObserver(() => { if (st.theme === "auto") render(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

function toast(msg){ const scr = $("scr"); if (!scr) return; const old = scr.querySelector(".toast"); if (old) old.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; el.style.position = "sticky"; el.style.bottom = "100px"; el.style.margin = "0 auto"; el.style.width = "max-content"; el.style.maxWidth = "90%";
  scr.querySelector(".m").appendChild(el); setTimeout(() => el.remove(), 2400); }

/* sample: the app's own clips. Lao (repeat × at the chosen speed), the Korean meaning once after the first when 한국어 음성 is on */
const ALO = new Audio("img/s-lo.mp3"), AKO = new Audio("img/s-ko.mp3");
let cur = null;
function playOne(a, rate){ return new Promise(res => { cur = a; a.currentTime = 0; a.playbackRate = rate; try { a.preservesPitch = true; } catch (e) {} a.onended = res; a.onerror = res; const p = a.play(); if (p && p.catch) p.catch(res); }); }
async function sample(){
  if (playing){ playing = false; if (cur) cur.pause(); render(); return; }
  playing = true; render(); const n = +st.rep || 1;
  for (let i = 0; i < n && playing; i++){ await playOne(ALO, +st.rate || 1); if (i === 0 && st.voice && playing) await playOne(AKO, 1); }
  playing = false; render();
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button,a"); if (!b) return;
  if (b.dataset.dev){ st.dev = b.dataset.dev; render(); return; }
  if (b.id === "zoom"){ st.zoom = !st.zoom; fit(); $("zoom").textContent = st.zoom ? "화면에 맞춤" : "실제 크기"; return; }
  if (b.dataset.rep){ st.rep = b.dataset.rep; render(); return; }
  if (b.dataset.theme){ st.theme = b.dataset.theme; render(); return; }
  if (b.dataset.fz){ st.fz = +b.dataset.fz; render(); return; }
  if (b.hasAttribute("data-voice")){ st.voice = !st.voice; render(); return; }
  if (b.dataset.os){ const [d, k] = b.dataset.os.split(":"); st.os[d] = k; render(); return; }
  const a = b.dataset.act; if (!a) return;
  ev.preventDefault();
  if (a === "sample") sample();
  else if (a === "copy"){ const done = () => toast(x.copied); try { navigator.clipboard.writeText("https://" + URL_APP + "/").then(done, done); } catch (e) { done(); } }
  else if (a === "start") toast("→ 앱 첫 화면 (" + st.rep + "회 · ×" + (+st.rate).toFixed(1) + (st.voice ? " · 한국어 음성" : "") + ")");
  else if (a === "install") toast("시안: 실제 앱에서는 설치 창이 떠요");
  else if (a === "audio") toast("시안: 앱의 ‘음성 전체 저장’과 같아요");
  else if (a === "poster") toast("시안: PhasaLAO 포스터(A4)를 받아요");
  else if (a === "how"){ const el = $("scr").querySelector(".steps"); if (el) el.scrollIntoView({behavior: "smooth", block: "center"}); }
});
document.addEventListener("input", ev => { if (ev.target.matches("[data-rate]")){ st.rate = (+ev.target.value).toFixed(1).replace(/\.0$/, ""); const o = ev.target.parentNode.querySelector("output"); if (o) o.textContent = "×" + (+st.rate).toFixed(1); keep(); } });
document.addEventListener("change", ev => { if (ev.target.matches("[data-rate]")) render(); });
render();
})();
</script>
